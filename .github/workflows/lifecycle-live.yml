# ENG-485 Task 16 (spec 11.2, D14): the live lifecycle checks, run by hand only (workflow_dispatch).
#
# smoke: scripts/smoke-lifecycle.ts on a GitHub Ubuntu VM. The control is the branch
#   baseline/pre-eng-485 (main before ENG-485; the smoke refuses to run without it, or if it has the
#   stop handlers), and must leak the agent under kill and kill -9 (or the run says the probes are
#   blind); the new code must stop the agent and its command under Ctrl-C, kill, kill -9 followed by
#   `styre ls`, a dispatch timeout, and Ctrl-\. First the free mode (`--standin`: the stand-in claude, no
#   model calls), then the live run (`--live`: seventeen real agent dispatches on the cheap model). The
#   smoke refuses to run without one of the two, or with any argument it does not know. The ANTHROPIC_API_KEY
#   secret is given to the live step only. Each run is exec'd under `timeout`, so a cancel of this
#   job reaches the smoke itself, which then stops what it started. claude is installed with npm at
#   the version on npm's `latest` dist tag when this was written (not `next`), the same pin as
#   scripts/smoke-lifecycle-container.sh: the npm package installs the same native binary as the
#   recommended installer (code.claude.com/docs/en/setup, "Install with npm").
#
# cancel-with-exec / cancel-without-exec: what GitHub's cancel does to a `run:` step running the
#   compiled styre, with and without `exec` (D14). The step runs `styre setup` with a stand-in agent
#   (the fake claude CLI in hang mode: no real agent, no secret), until the job's 3 minute timeout
#   cancels it, or someone cancels the run by hand. Then assert-cancel.sh reads what happened:
#     with exec:    Styre is the step's process, handles GitHub's SIGINT and stops the agent;
#     without exec: bash is the step's process; GitHub's SIGINT and then SIGTERM (7.5 s later) reach
#                   bash only, bash dies on the SIGTERM, and Styre and the agent keep running until
#                   the job's orphan cleanup kills them ("Terminate orphan process" under "Complete
#                   job"). scripts/simulate-github-cancel.ts predicts both locally from the runner's
#                   source (actions/runner src/Runner.Sdk/ProcessInvoker.cs).
#   Run the workflow twice: once letting the timeout fire, once cancelling the run by hand while the
#   long steps run (the runner treats both as the same cancel request; the run records whether
#   GitHub agrees). The `CANCEL_*` names come from test/lifecycle/cancel-prepare.sh, and each long
#   step's text is pinned by test/lifecycle/live-smoke.test.ts to what the simulation runs.
name: lifecycle-live
on: workflow_dispatch

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7 (node24)
      - name: Fetch the control's baseline branch
        run: git fetch --depth 1 --no-tags origin +refs/heads/baseline/pre-eng-485:refs/remotes/origin/baseline/pre-eng-485
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6  # v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: npm install -g @anthropic-ai/claude-code@2.1.293
      - run: claude --version && bun --version
      - name: Free run with the stand-in claude (no model calls)
        run: ulimit -c 0 && exec timeout 900 bun run scripts/smoke-lifecycle.ts --standin
      - name: Live smoke (real claude; seventeen dispatches)
        run: ulimit -c 0 && exec timeout 1500 bun run scripts/smoke-lifecycle.ts --live
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

  cancel-with-exec:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7 (node24)
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6  # v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile && bun run build
      - run: bash test/lifecycle/cancel-prepare.sh cancel-exec
      - name: Long run with exec, cancelled by the job timeout or by hand
        env:
          STYRE: ${{ github.workspace }}/dist/styre
        run: |
          echo "step $$" >"$CANCEL_PIDS"
          exec "$STYRE" setup "$CANCEL_REPO" --config "$CANCEL_CONFIG" --out "$CANCEL_OUT" 2>"$CANCEL_LOG"
      - if: always()
        run: bash test/lifecycle/assert-cancel.sh cancel-exec graceful

  cancel-without-exec:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7 (node24)
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6  # v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile && bun run build
      - run: bash test/lifecycle/cancel-prepare.sh cancel-noexec
      - name: Long run without exec, cancelled by the job timeout or by hand
        env:
          STYRE: ${{ github.workspace }}/dist/styre
        run: |
          echo "step $$" >"$CANCEL_PIDS"
          "$STYRE" setup "$CANCEL_REPO" --config "$CANCEL_CONFIG" --out "$CANCEL_OUT" 2>"$CANCEL_LOG"
      - if: always()
        run: bash test/lifecycle/assert-cancel.sh cancel-noexec orphaned
