name: CI

on:
  push:
    branches: [main]
  pull_request:
    # `edited` so a title/body change re-runs the jobs — the pr-title
    # Conventional-Commits lint must re-evaluate when the title is fixed
    # (default types omit `edited`, so a title-only edit otherwise never re-checks).
    types: [opened, synchronize, reopened, edited]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7  # node24
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run typecheck
      - run: bun test
      - name: Compile-smoke (build + run the binary)
        run: |
          bun run build
          ./dist/styre --version
          ./dist/styre migrate --db ./ci.db

  native-test-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - uses: actions/setup-node@v7
        with:
          node-version: '20.19.5'
          package-manager-cache: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - run: bun install --frozen-lockfile
      - name: Install pinned native test runners
        run: |
          npm install --prefix "$RUNNER_TEMP/styre-native-contract" --ignore-scripts --no-audit --no-fund mocha@10.2.0 jest@29.7.0 vitest@2.1.9
          python -m venv "$RUNNER_TEMP/styre-native-contract/venv"
          "$RUNNER_TEMP/styre-native-contract/venv/bin/pip" install pytest==8.3.5 Django==4.2.23
      - name: Verify native execution contracts
        run: STYRE_TEST_NATIVE_ROOT="$RUNNER_TEMP/styre-native-contract" bun test test/dispatch/check-execution.test.ts
      - name: Verify environment qualification contracts
        run: |
          export PATH="$RUNNER_TEMP/styre-native-contract/venv/bin:$PATH"
          STYRE_ENV_NATIVE_NODE_DEPS="$RUNNER_TEMP/styre-native-contract/node_modules" STYRE_ENV_NATIVE_PYTHON=1 bun test test/testing

  native-browser-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - name: Prepare pinned Sphinx baseline fixture
        shell: bash
        run: |
          set -euo pipefail
          fixture="$RUNNER_TEMP/styre-karma-baseline"
          context="$RUNNER_TEMP/styre-karma-image"
          mkdir -p "$fixture" "$context/sphinx"
          git -C "$fixture" init
          git -C "$fixture" fetch --depth=1 https://github.com/sphinx-doc/sphinx.git 2e506c5ab457cba743bb47eb5b8c8eb9dd51d23d
          test "$(git -C "$fixture" rev-parse FETCH_HEAD)" = 2e506c5ab457cba743bb47eb5b8c8eb9dd51d23d
          git -C "$fixture" archive FETCH_HEAD package.json package-lock.json karma.conf.js tests/js sphinx/themes/basic/static/underscore.js sphinx/themes/basic/static/jquery.js sphinx/themes/basic/static/doctools.js | tar -xf - -C "$context/sphinx"
          cat > "$context/Dockerfile" <<'DOCKERFILE'
          FROM node:20-bookworm
          RUN apt-get update && apt-get install -y --no-install-recommends firefox-esr xvfb xauth && rm -rf /var/lib/apt/lists/*
          WORKDIR /suite
          COPY sphinx/ ./
          RUN npm ci --ignore-scripts --no-audit --no-fund
          ENV FIREFOX_BIN=/usr/bin/firefox-esr
          DOCKERFILE
          docker build -t styre-karma-native "$context"
      - name: Verify browser adapter and Sphinx baseline contracts
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm --init --network none --memory 3g --cpus 2 --pids-limit 512 \
            -v "$GITHUB_WORKSPACE:/code:ro" \
            -v "$(command -v bun):/usr/local/bin/bun:ro" \
            -e STYRE_KARMA_NATIVE_DEPS=/suite/node_modules \
            -e STYRE_KARMA_SPHINX=/suite \
            styre-karma-native xvfb-run -a bun test /code/test/testing/karma-native.test.ts

  pr-title:
    # Conventional-Commits lint on the PR title. Squash-merge makes the PR title
    # the commit + changelog line git-cliff parses, so a malformed title would
    # silently corrupt version/changelog computation.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    steps:
      - uses: amannn/action-semantic-pull-request@e32d7e603df1aa1ba07e981f2a23455dee596825  # v5.x
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
